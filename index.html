<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Customer Service Bot — Connect Instagram</title>
<style>
  :root {
    --purple: #6d28d9;
    --blue: #2563eb;
    --ink: #1f2430;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--purple), var(--blue));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    max-width: 440px;
    width: 100%;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }
  .badge {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: linear-gradient(160deg, var(--purple), var(--blue));
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  h1 { font-size: 20px; color: var(--ink); margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 28px; }
  button#connectBtn {
    width: 100%;
    padding: 14px 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--purple), var(--blue));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button#connectBtn:hover { opacity: 0.92; }
  .result { display: none; margin-top: 24px; padding: 20px; border-radius: 16px; background: #f6f7fb; text-align: left; }
  .result.show { display: block; }
  .profile-row { display: flex; align-items: center; gap: 14px; }
  .profile-row img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
  .profile-row .name { font-weight: 600; color: var(--ink); font-size: 15px; }
  .profile-row .id { color: var(--muted); font-size: 12px; }
  .status { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .error { margin-top: 16px; font-size: 13px; color: #b91c1c; background: #fef2f2; padding: 12px 14px; border-radius: 10px; display: none; }
  .error.show { display: block; }
  .footnote { margin-top: 22px; font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>

  <div class="card">
    <div class="badge">💬</div>
    <h1>AI Customer Service Bot</h1>
    <p class="sub">Connect your Instagram professional account to let the bot read and reply to your Direct Messages automatically.</p>

    <button id="connectBtn">Connect Instagram Account</button>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <div class="profile-row">
        <img id="profilePic" src="" alt="Profile picture" />
        <div>
          <div class="name" id="profileName">—</div>
          <div class="id" id="profileId">—</div>
        </div>
      </div>
      <div class="status" id="statusText">Fetching connected account…</div>
    </div>

    <div class="footnote">This demo page is used for Meta App Review verification of instagram_business_basic and instagram_business_manage_messages.</div>
  </div>

<script>
  // ---- CONFIGURATION ----
  const APP_ID = "913670561429164";
  // This MUST be your Cloudflare Worker URL, not this page's own URL,
  // because Instagram sends the "code" here first for the secure token exchange.
  const WORKER_REDIRECT_URI = "https://ig-oauth-exchange.ezzx11.workers.dev";
  const SCOPES = "instagram_business_basic,instagram_business_manage_messages";
  // ------------------------

  const connectBtn = document.getElementById("connectBtn");
  const resultBox = document.getElementById("resultBox");
  const errorBox = document.getElementById("errorBox");
  const statusText = document.getElementById("statusText");
  const profilePic = document.getElementById("profilePic");
  const profileName = document.getElementById("profileName");
  const profileId = document.getElementById("profileId");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }

  connectBtn.addEventListener("click", () => {
    const authUrl = `https://www.instagram.com/oauth/authorize` +
      `?client_id=${APP_ID}` +
      `&redirect_uri=${encodeURIComponent(WORKER_REDIRECT_URI)}` +
      `&response_type=code` +
      `&scope=${encodeURIComponent(SCOPES)}`;
    window.location.href = authUrl;
  });

  async function handleReturn() {
    const params = new URLSearchParams(window.location.search);
    const accessToken = params.get("access_token");
    const oauthError = params.get("error");

    if (oauthError) {
      showError(oauthError);
      return;
    }
    if (!accessToken) return;

    connectBtn.style.display = "none";
    resultBox.classList.add("show");
    statusText.textContent = "Fetching Instagram profile info…";

    try {
      const res = await fetch(
        `https://graph.instagram.com/v26.0/me?fields=user_id,username,profile_picture_url&access_token=${accessToken}`
      );
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      profilePic.src = data.profile_picture_url || "";
      profileName.textContent = "@" + (data.username || "unknown");
      profileId.textContent = "Instagram User ID: " + data.user_id;
      statusText.textContent = "Connected successfully. This account is now authorized to receive automated replies from the bot.";
    } catch (err) {
      statusText.textContent = "";
      showError("Failed to fetch profile: " + err.message);
    }
  }

  handleReturn();
</script>

</body>
</html>
